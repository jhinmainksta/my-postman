<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="method-colors.css" />
    <title>myPostman</title>
  </head>
  <body>
    <div class="side-bar">
      <button id="col-create-btn">Create</button>
      <button id="col-open-btn">Open</button>
    </div>

    <div class="http-request">
      <div class="cover">
        <div class="request-field">
          <div id="request-bar" class="request-bar">
            <select id="method" class="rb-select">
              <option value="GET" class="color-GET" selected>GET</option>
              <option value="POST" class="color-POST">POST</option>
              <option value="PUT" class="color-PUT">PUT</option>
              <option value="PATCH" class="color-PATCH">PATCH</option>
              <option value="DELETE" class="color-DELETE">DELETE</option>
            </select>
            <input
              id="url-input"
              type="text"
              placeholder="enter url"
              class="rb-input"
            />
          </div>
          <p>Body</p>
          <textarea class="body-text" id="request-body"></textarea>
        </div>

        <div class="resizer"></div>
      </div>

      <div class="response-field">
        <div class="tab-buttons">
          <div class="buttons-left">
            <button class="tab-btn active" data-tab="response-body">
              Body
            </button>
            <button class="tab-btn" data-tab="response-headers">Headers</button>
          </div>
          <div class="response-status" id="response-status"></div>
        </div>

        <div class="tab-contents">
          <div class="tab-content active" id="response-body"></div>
          <div class="tab-content" id="response-headers"></div>
        </div>
      </div>
      <p class="info-p" id="info"></p>
    </div>

    <script src="renderer.js"></script>
    <script src="resizer.js"></script>
    <script src="collectionsManager.js"></script>
  </body>
</html>
