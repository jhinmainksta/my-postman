<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="index.css" />
    <title>myPostman</title>
  </head>
  <body>
    <h1>myPostman</h1>
    <div>
      <select id="method">
        <option value="GET" selected>GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>
      <input
        id="url-input"
        type="text"
        placeholder="enter url"
        style="width: 400px"
      />
    </div>
    <p>Request body</p>
    <textarea id="request-body" rows="10" cols="100"></textarea>
    <p>Response</p>
    <div id="response-status"></div>
    <div class="scrollbar" id="response-headders"></div>
    <div class="scrollbar" id="response-body"></div>
    <p id="info"></p>
    <script src="renderer.js"></script>
  </body>
</html>
